# Déploiement automatique : à chaque push sur `main`, connexion WireGuard puis SSH
# vers matos → sauvegarde BDD → git pull + deps + migrations + restart Gunicorn.
#
# Secrets GitHub (Settings → Secrets and variables → Actions) :
#   WIREGUARD_CONFIG — configuration client WireGuard complète ([Interface] + [Peer])
#   DEPLOY_HOST      — IP WireGuard du serveur matos (ex. 10.8.0.1)
#   DEPLOY_USER      — utilisateur SSH (ex. root)
#   DEPLOY_SSH_KEY   — clé privée SSH dont la clé publique est dans authorized_keys
#
# Variables (Settings → Secrets and variables → Actions → Variables) :
#   DEPLOY_APP_DIR   — chemin du dépôt sur le serveur (défaut : /root/AIM)
#   AIM_SERVICE      — service systemd à redémarrer (défaut : aim)
#
# Prérequis sur matos (/root/AIM) :
#   - peer WireGuard dédié à la CI (AllowedIPs incluant l'IP du serveur)
#   - SSH accessible depuis le subnet WireGuard
#   - git clone à jour sur main, accès pull (clé deploy ou token)
#   - venv + pip install -r requirements.txt
#   - systemd : bash scripts/setup-matos.sh  (service aim, nginx matos.anc93.com)
#   - .deploy.local optionnel (voir .deploy.local.example)

name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aim
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion WireGuard
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${WIREGUARD_CONFIG:-}" ]]; then
            echo "Erreur : secret WIREGUARD_CONFIG manquant." >&2
            exit 1
          fi
          if ! command -v wg-quick >/dev/null 2>&1; then
            echo "Installation wireguard-tools..."
            timeout 90 sudo apt-get update -qq
            timeout 120 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              --no-install-recommends wireguard-tools
          fi
          sudo modprobe wireguard 2>/dev/null || true
          umask 077
          printf '%s\n' "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo wg show
          if [[ -n "${DEPLOY_HOST:-}" ]]; then
            echo "Attente tunnel vers ${DEPLOY_HOST}..."
            for attempt in $(seq 1 15); do
              if ping -c 1 -W 2 "$DEPLOY_HOST" >/dev/null 2>&1; then
                echo "Tunnel OK (tentative ${attempt})."
                break
              fi
              if [[ "$attempt" -eq 15 ]]; then
                echo "Erreur : ${DEPLOY_HOST} injoignable via WireGuard." >&2
                sudo wg show
                exit 1
              fi
              sleep 2
            done
          fi

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
          AIM_SERVICE: ${{ vars.AIM_SERVICE }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_HOST:-}" || -z "${DEPLOY_USER:-}" || -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo "Erreur : DEPLOY_HOST, DEPLOY_USER ou DEPLOY_SSH_KEY manquant." >&2
            exit 1
          fi
          APP_DIR="${DEPLOY_APP_DIR:-/root/AIM}"
          SERVICE="${AIM_SERVICE:-aim}"
          echo "Cible : ${DEPLOY_USER}@${DEPLOY_HOST}:${APP_DIR} (service ${SERVICE})"

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=30 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$APP_DIR" "$SERVICE" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          export AIM_SERVICE="${2:-aim}"
          bash scripts/deploy-remote.sh
          REMOTE

      - name: Déconnexion WireGuard
        if: always()
        run: sudo wg-quick down wg0 2>/dev/null || true
