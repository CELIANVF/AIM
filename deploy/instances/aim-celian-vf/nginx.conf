# Nginx — instance AIM sur aim.celian-vf.fr (port Gunicorn 5002)
# Installation :
#   sudo cp deploy/instances/aim-celian-vf/nginx.conf /etc/nginx/sites-available/aim-celian-vf.fr
#   sudo ln -sf /etc/nginx/sites-available/aim-celian-vf.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (DNS aim.celian-vf.fr → ce serveur) :
#   sudo certbot --nginx -d aim.celian-vf.fr

server {
    listen 80;
    listen [::]:80;
    server_name aim.celian-vf.fr;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /home/celian/AIM-celian-vf/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
