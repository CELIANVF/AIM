# Nginx — instance principale AIM sur matos.anc93.com (port Gunicorn 5001)
# Installation :
#   sudo cp deploy/instances/aim-matos/nginx.conf /etc/nginx/sites-available/matos.anc93.com
#   sudo ln -sf /etc/nginx/sites-available/matos.anc93.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL :
#   sudo certbot --nginx -d matos.anc93.com

server {
    listen 80;
    listen [::]:80;
    server_name matos.anc93.com;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /root/AIM/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
